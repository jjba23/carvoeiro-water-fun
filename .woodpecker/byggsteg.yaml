variables:
  - &byggsteg_url 'https://byggsteg.jointhefreeworld.org'
  - &byggsteg_submit_job_image 'jjba23/byggsteg-woodpecker-submit-job:v0.1.3'
  - &byggsteg_poll_job_image 'jjba23/byggsteg-woodpecker-poll-job:v0.1.3'
  
steps:
  submit-byggsteg-job-jointhefreeworld:
    image: *byggsteg_submit_job_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      BYGGSTEG_USERNAME:
        from_secret: "BYGGSTEG_USERNAME"
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"      
      BYGGSTEG_URL: *byggsteg_url
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . "pull-and-deploy")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")            
            (clone-url . "%%CI_REPO_CLONE_URL%%")))
            
  poll-byggsteg-job-jointhefreeworld:
    image: *byggsteg_poll_job_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      BYGGSTEG_USERNAME:
        from_secret: "BYGGSTEG_USERNAME"
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"      
      BYGGSTEG_URL: *byggsteg_url
