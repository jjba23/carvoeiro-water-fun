variables:
  - &submit_job_image "docker.io/jjba23/byggsteg-woodpecker-submit-job:v0.2.0"
  - &poll_job_image "docker.io/jjba23/byggsteg-woodpecker-poll-job:v0.2.0"
  - &get_token_image "docker.io/jjba23/byggsteg-woodpecker-get-token:v0.2.0"
  - &byggsteg_url "https://byggsteg.jointhefreeworld.org"

steps:
  get-byggsteg-token-jointhefreeworld:
    image: *get_token_image
    when:
      - event: ["push"]
        branch: ["trunk"]
    settings:
      BYGGSTEG_EMAIL:
        from_secret: "BYGGSTEG_EMAIL"
      BYGGSTEG_PASSWORD:
        from_secret: "BYGGSTEG_PASSWORD"
      BYGGSTEG_URL: *byggsteg_url

  submit-byggsteg-job-jointhefreeworld:
    image: *submit_job_image
    when:
      - event: ["push"]
        branch: ["trunk"]
    settings:
      BYGGSTEG_URL: *byggsteg_url
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . "maak-deploy")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")
            (clone-url . "%%CI_REPO_CLONE_URL%%")))

  poll-byggsteg-job-jointhefreeworld:
    image: *poll_job_image
    when:
      - event: ["push"]
        branch: ["trunk"]
    settings:
      BYGGSTEG_URL: *byggsteg_url
